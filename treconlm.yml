name: treconlm
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # PyTorch with CUDA support (matches Dev Container: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime)
  - cudatoolkit=12.1
  - tensorboard
  - pytest
  - scipy=1.11.4
  - imageio
  - pip
  - pip:
    # PyTorch - use extra-index-url so other packages can still use PyPI
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.1.0+cu121
    - torchvision==0.16.0+cu121
    # Pin versions for reproducibility and compatibility
    - numpy<2.0  # numpy 2.x has GLIBC compatibility issues
    - pillow<11  # pillow 11+ has GLIBC compatibility issues
    - ipykernel
    - ipywidgets
    - tiktoken
    - matplotlib
    - tqdm
    - wandb
    - pyyaml
    - pandas
    - timm==0.9.16  # Pin timm to avoid torch version upgrade
    - memory_profiler
    - hydra-core
    - pytz
    - Levenshtein
    - scikit-learn
    - torchmetrics
    - huggingface_hub
    - datasets
    - tabulate
    - seaborn
    - bitsandbytes  # Unpinned; torch 2.1.0 is compatible with recent versions
    - biopython

