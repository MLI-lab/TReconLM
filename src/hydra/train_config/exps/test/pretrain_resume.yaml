# @package _global_

# =============================================================================
# Test for resuming pretraining from a checkpoint
# Continues training from a previously saved checkpoint
#
# Usage: python src/pretrain.py exps=test/pretrain_resume
#
# You must first run pretrain_scratch.yaml to create a checkpoint,
#       then update general.train_time below to match the checkpoint folder.
# =============================================================================

defaults:
  - override /general: resume      # Resume from existing checkpoint
  - override /data: ids_data       # IDS channel data (insertions, deletions, substitutions)
  - override /model: gpt           # Use GPT architecture
  - override /train: base          # Base training settings

# Project and experiment names (must match the original run to find checkpoint)
project: TRACE_RECONSTRUCTION
experiment: pretraining_test

general:
  # Timestamp of the checkpoint folder to resume from
  # Format: YYYYMMDD_HHMMSS (found in checkpoint folder name)
  # Example: train_run_gpt_20241127_175939 -> use '20241127_175939'
  # UPDATE THIS after running pretrain_scratch.yaml
  train_time: '20251212_144011'

# -----------------------------------------------------------------------------
# Data settings (must match original pretraining config)
# -----------------------------------------------------------------------------
data:
  sequence_type: nuc              # Nucleotide sequences (ACGT)
  target_type: CPRED              # Candidate prediction (predict ground truth from reads)
  observation_size: 5             # Max reads per cluster
  ground_truth_length: 60         # Sequence length in nucleotides
  lower_bound_obs_size: 2         # Min reads per cluster
  block_size: 600                 # Context window size (must fit reads + ground truth)

# -----------------------------------------------------------------------------
# Training settings
# -----------------------------------------------------------------------------
train:
  device: cuda:0                  # GPU device (DDP auto-detected via torchrun)

  # Iteration settings
  max_iters: 200               # Total training iterations
  batch_size: 4                   # Examples per batch
  gradient_accumulation_steps: 2  # Accumulate gradients (must be multiple of GPUs if using DDP)

  # Evaluation settings
  eval_interval: 500              # Evaluate every N iterations
  eval_iters: 1000                # Batches to evaluate
  eval_only: false                # If true, only run evaluation (no training)

  # Checkpointing
  always_interval: 600            # Save checkpoint every N iterations
  always_save_checkpoint: true    # Always save (not just on improvement)

  # Logging
  log_interval: 10                # Log training loss every N iterations

  # Optimizer settings
  learning_rate: 0.0001           # Initial learning rate
  weight_decay: 0.1               # L2 regularization
  beta1: 0.9                      # Adam beta1
  beta2: 0.95                     # Adam beta2
  grad_clip: 1.0                  # Gradient clipping threshold

  # Learning rate schedule
  decay_lr: true                  # Use cosine decay
  warmup_iters: 5000              # Linear warmup iterations
  min_lr: 0.0                     # Minimum learning rate
  lr_decay_iters: ${train.max_iters}  # Decay over all iterations

# -----------------------------------------------------------------------------
# Model architecture (must match original pretraining config)
# -----------------------------------------------------------------------------
model:
  compile: false                  # Disabled for Python 3.11+ compatibility
  gpt_params:
    n_layer: 2                    # Transformer layers
    n_head: 2                     # Attention heads
    n_embd: 64                    # Embedding dimension
    dropout: 0                    # Dropout rate
    bias: false                   # No bias in linear layers

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
wandb:
  wandb_log: false                # Disable W&B logging for testing
