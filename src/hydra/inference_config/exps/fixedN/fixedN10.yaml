# @package _global_

defaults:
  - override /data:  ids_data
  - override /model: gpt

project: 'Inference'
experiment: 'fixed_N2' 

data:
  artifact_name: test_dataset_seed34721_gl110_bs1500_ds50000
  ground_truth_length: 110
  block_size: 1500
  batch_size: 100  # Reduced for memory safety with majority voting (10 permutations -> effective_batch_size=3)
  test_seed: 34721
  observation_size: 10
  lower_bound_obs_size: 2
  test_dataset_size: 50000


model: 
  checkpoint_path: /mnt/model_checkpoints/FixedN/N10/checkpoint_best.pt
  sampling:
    temperature: 1.0
    top_k: None
    strategy: greedy      # greedy or beam_search
    max_new_tokens: ${data.ground_truth_length}
    constrained_generation: False # to just generate ACTG 
    save_sequences: true                                                                                                     
    sequence_output_file: /workspaces/TReconLM/src/hydra/inference_config/exps/fixedN/predictions_output.tsv  # optional, defaults to predictions_output.tsv
